<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEY · Каталог-калькулятор аксессуаров</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0A0A0A; --black-soft: #141414; --black-card: #1A1A1A;
    --border: #2A2A2A; --border-light: #383838;
    --gold: #C9A66B; --gold-soft: #E2C998; --gold-dark: #A8884F;
    --white: #FFFFFF; --silver: #B8B8B8; --gray: #707070; --ivory: #F5F1EA;
    --shadow: 0 4px 14px rgba(0,0,0,0.5);
  }
  html, body { background: var(--black); color: var(--white); font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .app { max-width: 1400px; margin: 0 auto; padding: 24px; padding-bottom: 130px; }

  .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  .brand { font-size: 28px; font-weight: 700; letter-spacing: 6px; }
  .brand-sub { font-size: 11px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; margin-top: 4px; }
  .dealer { text-align: right; font-size: 12px; color: var(--silver); line-height: 1.6; }
  .dealer strong { color: var(--white); letter-spacing: 1px; }

  .hero-banner {
    height: 220px; margin: 0 -24px 32px; background-size: cover; background-position: center;
    position: relative; display: flex; align-items: flex-end; padding: 32px 48px;
    border-bottom: 2px solid var(--gold); transition: background-image 0.4s;
  }
  .hero-banner::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(10,10,10,0.85) 0%, rgba(10,10,10,0.4) 60%, transparent 100%); }
  .hero-content { position: relative; z-index: 1; }
  .hero-eyebrow { font-size: 11px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; }
  .hero-name { font-size: 36px; font-weight: 700; letter-spacing: 3px; margin: 8px 0 4px; }
  .hero-desc { color: var(--silver); font-size: 13px; }

  .controls { display: flex; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; align-items: stretch; }
  .model-selector { display: flex; gap: 12px; flex: 1; min-width: 320px; }
  .model-btn {
    flex: 1; background: var(--black-card); border: 1px solid var(--border);
    color: var(--silver); padding: 14px 20px; cursor: pointer; transition: all 0.2s;
    text-align: left; border-radius: 2px; font-family: inherit;
  }
  .model-btn:hover { border-color: var(--gold-dark); color: var(--white); }
  .model-btn.active { background: linear-gradient(135deg, var(--black-card), #1f1f1f); border-color: var(--gold); color: var(--white); box-shadow: 0 0 0 1px var(--gold); }
  .model-btn-eyebrow { font-size: 9px; letter-spacing: 2.5px; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; }
  .model-btn-name { font-size: 18px; font-weight: 700; letter-spacing: 3px; }

  .body-toggle { display: none; align-items: center; gap: 8px; background: var(--black-soft); border: 1px solid var(--border); padding: 10px 16px; border-radius: 2px; }
  .body-toggle.show { display: flex; }
  .body-toggle-label { font-size: 10px; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
  .toggle-btn { background: transparent; border: 1px solid var(--border-light); color: var(--silver); padding: 6px 14px; cursor: pointer; font-size: 12px; font-weight: 700; transition: all 0.15s; border-radius: 2px; font-family: inherit; }
  .toggle-btn.active { background: var(--gold); color: var(--black); border-color: var(--gold); }

  .tab-nav { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid var(--border); overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .tab-nav::-webkit-scrollbar { display: none; }
  .tab { background: transparent; border: none; color: var(--silver); padding: 14px 20px; cursor: pointer; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; transition: all 0.15s; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-family: inherit; }
  .tab:hover { color: var(--white); }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab .badge { display: inline-block; background: var(--gold); color: var(--black); font-size: 10px; padding: 1px 6px; border-radius: 8px; margin-left: 6px; min-width: 18px; text-align: center; }

  .info-block { background: var(--black-soft); border-left: 3px solid var(--gold); padding: 14px 18px; margin-bottom: 20px; border-radius: 2px; color: var(--silver); font-size: 13px; font-style: italic; }

  .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .item-card, .variant-card { background: var(--black-card); border: 1px solid var(--border); border-radius: 2px; overflow: hidden; display: flex; flex-direction: column; }
  .item-card { cursor: pointer; transition: all 0.2s; }
  .item-card:hover { border-color: var(--gold-dark); transform: translateY(-2px); box-shadow: var(--shadow); }
  .item-card.selected { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
  .item-img { background: var(--ivory); height: 200px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .item-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .item-img-placeholder { color: var(--gray); font-size: 11px; letter-spacing: 2px; font-style: italic; }
  .item-body-content { padding: 16px 18px; flex: 1; display: flex; flex-direction: column; }
  .item-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .item-name { font-size: 15px; font-weight: 700; color: var(--white); flex: 1; line-height: 1.3; }
  .check { flex-shrink: 0; width: 22px; height: 22px; border: 1.5px solid var(--border-light); border-radius: 3px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .item-card.selected .check { background: var(--gold); border-color: var(--gold); }
  .check svg { width: 14px; height: 14px; fill: var(--black); opacity: 0; transition: opacity 0.15s; }
  .item-card.selected .check svg { opacity: 1; }
  .item-sub { font-size: 12px; color: var(--silver); font-style: italic; margin-bottom: 10px; }
  .item-desc { font-size: 12px; color: var(--silver); line-height: 1.55; margin-bottom: 12px; flex: 1; }
  .item-features { list-style: none; margin-bottom: 14px; padding: 0; }
  .item-features li { font-size: 11.5px; color: var(--silver); padding: 3px 0 3px 14px; position: relative; }
  .item-features li::before { content: '·'; position: absolute; left: 4px; color: var(--gold); font-weight: 700; }
  .item-meta { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--border); gap: 8px; }
  .item-sku { font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; color: var(--gold-soft); }
  .item-price { font-size: 18px; font-weight: 700; color: var(--gold); white-space: nowrap; }
  .item-badge { display: inline-block; background: var(--gold); color: var(--black); font-size: 9px; font-weight: 700; padding: 2px 7px; margin-left: 6px; letter-spacing: 1px; border-radius: 2px; vertical-align: middle; }
  .item-badge.body-s { background: var(--silver); }

  .variant-card .item-body-content { padding: 16px 18px 0; }
  .variant-list { padding: 0 18px 16px; }
  .variant { display: flex; align-items: center; gap: 12px; padding: 11px 12px; background: var(--black-soft); border: 1px solid var(--border); cursor: pointer; transition: all 0.15s; border-radius: 2px; margin-top: 8px; }
  .variant:hover { border-color: var(--border-light); }
  .variant.selected { border-color: var(--gold); background: #1f1c14; }
  .variant-radio { width: 18px; height: 18px; border: 1.5px solid var(--border-light); border-radius: 50%; flex-shrink: 0; position: relative; transition: all 0.15s; }
  .variant.selected .variant-radio { border-color: var(--gold); }
  .variant.selected .variant-radio::after { content: ''; position: absolute; inset: 3px; background: var(--gold); border-radius: 50%; }
  .variant-info { flex: 1; min-width: 0; }
  .variant-name { font-size: 13px; color: var(--white); font-weight: 600; }
  .variant-name small { color: var(--silver); font-weight: 400; font-style: italic; margin-left: 4px; }
  .variant-sku { font-size: 10px; color: var(--gold-soft); font-weight: 700; letter-spacing: 1px; margin-top: 2px; }
  .variant-price { font-size: 14px; font-weight: 700; color: var(--gold); white-space: nowrap; }

  .summary-bar { position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, var(--black) 0%, var(--black-soft) 100%); border-top: 2px solid var(--gold); padding: 18px 24px; box-shadow: 0 -10px 30px rgba(0,0,0,0.8); z-index: 100; }
  .summary-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .summary-stats { display: flex; align-items: center; gap: 32px; }
  .summary-count { font-size: 13px; color: var(--silver); }
  .summary-count strong { color: var(--white); font-size: 16px; margin: 0 4px; }
  .summary-total-label { font-size: 11px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; }
  .summary-total { font-size: 28px; font-weight: 700; color: var(--gold); letter-spacing: 1px; }
  .summary-actions { display: flex; gap: 12px; }
  .btn { background: transparent; border: 1px solid var(--gold-dark); color: var(--gold); padding: 12px 24px; cursor: pointer; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; transition: all 0.15s; border-radius: 2px; font-family: inherit; }
  .btn:hover { background: rgba(201,166,107,0.1); border-color: var(--gold); }
  .btn-primary { background: var(--gold); color: var(--black); border-color: var(--gold); }
  .btn-primary:hover { background: var(--gold-soft); }
  .btn-ghost { border-color: var(--border-light); color: var(--silver); }
  .btn-ghost:hover { color: var(--white); border-color: var(--silver); }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; z-index: 1000; overflow-y: auto; padding: 40px 20px; }
  .modal-backdrop.show { display: flex; }
  .invoice { background: var(--white); color: #1A1A1A; width: 100%; max-width: 800px; border-radius: 4px; box-shadow: 0 30px 80px rgba(0,0,0,0.8); }
  .invoice-actions { position: sticky; top: 0; background: var(--black); padding: 14px 30px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px 4px 0 0; z-index: 5; }
  .invoice-actions-title { color: var(--white); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
  .invoice-actions-btns { display: flex; gap: 10px; }
  .invoice-content { padding: 50px 60px; }
  .invoice-header { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 24px; border-bottom: 2px solid #C9A66B; margin-bottom: 30px; }
  .invoice-brand { font-size: 32px; font-weight: 700; letter-spacing: 6px; color: #0A0A0A; }
  .invoice-brand-sub { font-size: 11px; letter-spacing: 4px; color: #C9A66B; text-transform: uppercase; margin-top: 6px; font-weight: 700; }
  .invoice-dealer { text-align: right; font-size: 11px; color: #555; line-height: 1.7; }
  .invoice-dealer strong { color: #1A1A1A; font-size: 13px; letter-spacing: 1px; }
  .invoice-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 30px; }
  .invoice-meta-block strong { font-size: 10px; letter-spacing: 3px; color: #999; text-transform: uppercase; display: block; margin-bottom: 6px; font-weight: 700; }
  .invoice-meta-block .v { font-size: 14px; color: #1A1A1A; font-weight: 600; }
  .invoice-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .invoice-subtitle { font-size: 12px; color: #777; font-style: italic; margin-bottom: 24px; }
  .invoice-table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
  .invoice-table th { text-align: left; font-size: 10px; letter-spacing: 2px; color: #C9A66B; text-transform: uppercase; font-weight: 700; padding: 10px 8px; border-bottom: 2px solid #1A1A1A; }
  .invoice-table th.right { text-align: right; }
  .invoice-table td { padding: 12px 8px; border-bottom: 1px solid #E5E5E5; font-size: 13px; vertical-align: top; }
  .invoice-table .num { color: #999; font-size: 11px; width: 30px; }
  .invoice-table .sku { font-family: 'Courier New', monospace; color: #888; font-size: 11px; font-weight: 700; }
  .invoice-table .price { text-align: right; font-weight: 700; color: #1A1A1A; white-space: nowrap; }
  .invoice-table .cat-row td { background: #F8F5EE; padding: 8px; font-size: 10px; letter-spacing: 3px; color: #C9A66B; text-transform: uppercase; font-weight: 700; border-bottom: none; border-top: 1px solid #E5E5E5; }
  .invoice-totals { margin-left: auto; width: 320px; padding-top: 16px; border-top: 2px solid #1A1A1A; }
  .invoice-totals-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
  .invoice-totals-row.grand { border-top: 1px solid #DDD; margin-top: 8px; padding-top: 14px; font-size: 22px; font-weight: 700; }
  .invoice-totals-row.grand .price { color: #C9A66B; }
  .invoice-footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #DDD; font-size: 10px; color: #888; line-height: 1.7; }

  @media print {
    @page { size: A4; margin: 12mm; }
    body { background: white !important; }
    .app, .summary-bar, .invoice-actions { display: none !important; }
    .modal-backdrop { position: static !important; background: white !important; padding: 0 !important; display: block !important; }
    .invoice { box-shadow: none !important; max-width: 100% !important; }
    .invoice-content { padding: 0 !important; }
    .invoice-table .cat-row td { background: #F0F0F0 !important; }
  }
  @media (max-width: 700px) {
    .item-grid { grid-template-columns: 1fr; }
    .summary-stats { gap: 16px; }
    .summary-total { font-size: 22px; }
    .invoice-content { padding: 25px; }
    .hero-banner { height: 160px; padding: 20px 24px; }
    .hero-name { font-size: 26px; }
  }
</style>
</head>

<div class="app">
  <div class="header">
    <div>
      <div class="brand">W&nbsp;&nbsp;E&nbsp;&nbsp;Y</div>
      <div class="brand-sub">Каталог-калькулятор · 2026</div>
    </div>
    <div class="dealer">
      <strong>ООО «ГРИНВИЧ»</strong><br>
      г. Иркутск, ул. Ширямова, 32<br>
      8 (3952) 500-700
    </div>
  </div>

  <div class="hero-banner" id="heroBanner">
    <div class="hero-content">
      <div class="hero-eyebrow" id="heroEyebrow">Премиальный SUV</div>
      <div class="hero-name" id="heroName">WEY 07</div>

    <div class="body-toggle" id="bodyToggle">
      <span class="body-toggle-label">Кузов:</span>
      <button class="toggle-btn active" data-body="S">S · Стандарт</button>
      <button class="toggle-btn" data-body="L">L · Длинная база</button>
    </div>
  </div>

  <div class="tab-nav" id="tabNav"></div>
  <div id="catalog"></div>
</div>

<div class="summary-bar">
  <div class="summary-inner">
    <div class="summary-stats">
      <div class="summary-count">Выбрано: <strong id="cnt">0</strong></div>
      <div>
        <div class="summary-total-label">Итого</div>
        <div class="summary-total" id="total">0 ₽</div>

    </div>
    <div class="summary-actions">
      <button class="btn btn-ghost" id="btnClear">Сбросить</button>
      <button class="btn btn-primary" id="btnInvoice">Сформировать счёт</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="invoice">
    <div class="invoice-actions">
      <span class="invoice-actions-title">Предложение · Готово к печати</span>
      <div class="invoice-actions-btns">
        <button class="btn btn-ghost" id="btnClose">Закрыть</button>
        <button class="btn btn-primary" id="btnPrint">Печать / PDF</button>
      </div>
    </div>
    <div class="invoice-content" id="invoiceContent"></div>
  </div>
</div>

            img: 'body_film', price: 35000,
            desc: 'Защита большого лобового стекла минивэна от сколов и трещин.',
            features: ['Защита от сколов от камней', 'Сохраняет прозрачность', 'Препятствует образованию трещин', 'Не влияет на датчики и обогрев']
          },
        ]
      },
    ]
  }
};

/* ============================================================
   WEY Catalog-Calculator App Logic
   ============================================================ */
let currentModel = '07';
let currentBody = 'S';
let currentTab = null;
const selected = new Map();

const fmt = n => n.toLocaleString('ru-RU').replace(/,/g, ' ') + ' ₽';

function getImage(key) {
  if (typeof IMG !== 'undefined' && IMG[key]) return IMG[key];
  return null;
}

function renderItemImage(imgKey) {
  const data = getImage(imgKey);
  if (data) return `<img src="${data}" alt="">`;
  return `<div class="item-img-placeholder">${imgKey || 'нет фото'}</div>`;
}

function renderTabs() {
  const data = DATA[currentModel];
  const nav = document.getElementById('tabNav');
  if (!currentTab || !data.categories.find(c => c.id === currentTab)) {
    currentTab = data.categories[0].id;
  }
  const counts = {};
  for (const it of selected.values()) {
    counts[it._categoryId] = (counts[it._categoryId] || 0) + 1;
  }
  nav.innerHTML = data.categories.map(cat => {
    const count = counts[cat.id] || 0;
    const badge = count ? `<span class="badge">${count}</span>` : '';
    return `<button class="tab ${currentTab === cat.id ? 'active' : ''}" data-tab="${cat.id}">${cat.name}${badge}</button>`;
  }).join('');
  nav.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTab = btn.dataset.tab;
      renderTabs();
      renderCatalog();
    });
  });
}

function renderCatalog() {
  const data = DATA[currentModel];
  const cat = data.categories.find(c => c.id === currentTab);
  const root = document.getElementById('catalog');
  let html = '';

  if (cat.info) {
    html += `<div class="info-block">${cat.info}</div>`;
  }

  if (cat.items) {
    const visibleItems = cat.items.filter(it => !it.body || !data.hasBodyVariants || it.body === currentBody);
    if (visibleItems.length) {
      html += `<div class="item-grid">`;
      visibleItems.forEach(it => {
        const isSel = selected.has(it.sku);
        const bodyBadge = it.body ? `<span class="item-badge body-${it.body.toLowerCase()}">${it.body}</span>` : '';
        const premBadge = it.premium ? `<span class="item-badge">PREMIUM</span>` : '';
        const featuresList = (it.features || []).map(f => `<li>${f}</li>`).join('');
        html += `
          <div class="item-card ${isSel ? 'selected' : ''}" data-sku="${it.sku}">
            <div class="item-img">${renderItemImage(it.img)}</div>
            <div class="item-body-content">
              <div class="item-header">
                <div class="item-name">${it.name}${bodyBadge}${premBadge}</div>
                <div class="check"><svg viewBox="0 0 16 16"><path d="M6.173 12.414L1.5 7.741l1.414-1.414 3.259 3.259L13.086 3l1.414 1.414z"/></svg></div>
              </div>
              <div class="item-sub">${it.sub || ''}</div>
              <div class="item-desc">${it.desc || ''}</div>
              ${featuresList ? `<ul class="item-features">${featuresList}</ul>` : ''}
              <div class="item-meta">
                <span class="item-sku">${it.sku}</span>
                <span class="item-price">${fmt(it.price)}</span>
              </div>
            </div>
          </div>`;
      });
      html += `</div>`;
    }
  }

  if (cat.variantGroups) {
    html += `<div class="item-grid">`;
    cat.variantGroups.forEach(g => {
      const featuresList = (g.features || []).map(f => `<li>${f}</li>`).join('');
      let variantsHtml = '';
      g.options.forEach(opt => {
        const isSel = selected.has(opt.sku);
        const sublabel = opt.sublabel ? ` <small>· ${opt.sublabel}</small>` : '';
        const premBadge = opt.premium ? `<span class="item-badge">PREMIUM</span>` : '';
        variantsHtml += `
          <div class="variant ${isSel ? 'selected' : ''}" data-sku="${opt.sku}" data-group="${g.name}">
            <div class="variant-radio"></div>
            <div class="variant-info">
              <div class="variant-name">${opt.name}${sublabel}${premBadge}</div>
              <div class="variant-sku">${opt.sku}</div>
            </div>
            <div class="variant-price">${fmt(opt.price)}</div>
          </div>`;
      });
      html += `
        <div class="variant-card">
          <div class="item-img">${renderItemImage(g.img)}</div>
          <div class="item-body-content">
            <div class="item-name" style="margin-bottom:6px;">${g.name}</div>
            <div class="item-sub">${g.sub || ''}</div>
            ${featuresList ? `<ul class="item-features" style="margin-bottom:8px;">${featuresList}</ul>` : ''}
          </div>
          <div class="variant-list">${variantsHtml}</div>
        </div>`;
    });
    html += `</div>`;
  }

  root.innerHTML = html;
  root.querySelectorAll('.item-card').forEach(el => {
    el.addEventListener('click', () => toggleItem(el.dataset.sku));
  });
  root.querySelectorAll('.variant').forEach(el => {
    el.addEventListener('click', () => selectVariant(el.dataset.sku, el.dataset.group));
  });
}

function findItem(sku) {
  for (const cat of DATA[currentModel].categories) {
    if (cat.items) {
      const f = cat.items.find(i => i.sku === sku);
      if (f) return { ...f, _category: cat.name, _categoryId: cat.id };
    }
    if (cat.variantGroups) {
      for (const g of cat.variantGroups) {
        const f = g.options.find(o => o.sku === sku);
        if (f) return { ...f, _category: cat.name, _categoryId: cat.id, _group: g.name };
      }
    }
  }
  return null;
}

function toggleItem(sku) {
  if (selected.has(sku)) selected.delete(sku);
  else {
    const item = findItem(sku);
    if (item) selected.set(sku, item);
  }
  renderCatalog();
  renderTabs();
  updateSummary();
}

function selectVariant(sku, group) {
  for (const [k, v] of selected) {
    if (v._group === group && v._categoryId === currentTab && k !== sku) {
      selected.delete(k);
    }
  }
  if (selected.has(sku)) selected.delete(sku);
  else {
    const item = findItem(sku);
    if (item) selected.set(sku, item);
  }
  renderCatalog();
  renderTabs();
  updateSummary();
}

function updateSummary() {
  const total = [...selected.values()].reduce((s, i) => s + (i.price || 0), 0);
  document.getElementById('cnt').textContent = selected.size;
  document.getElementById('total').textContent = fmt(total);
}

function updateHero() {
  const data = DATA[currentModel];
  const heroImg = getImage(data.hero);
  const banner = document.getElementById('heroBanner');
  if (heroImg) banner.style.backgroundImage = `url(${heroImg})`;
  else banner.style.background = `linear-gradient(135deg, var(--black-card), var(--black-soft))`;
  document.getElementById('heroEyebrow').textContent = data.eyebrow;
  document.getElementById('heroName').textContent = data.name;
  document.getElementById('heroDesc').textContent = data.desc;
}

function setModel(m) {
  currentModel = m;
  selected.clear();
  currentTab = null;
  document.querySelectorAll('.model-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.model === m);
  });
  document.getElementById('bodyToggle').classList.toggle('show', DATA[m].hasBodyVariants);
  if (DATA[m].hasBodyVariants) {
    currentBody = 'S';
    document.querySelectorAll('.toggle-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.body === 'S');
    });
  }
  updateHero();
  renderTabs();
  renderCatalog();
  updateSummary();
}

function setBody(b) {
  currentBody = b;
  for (const [sku, it] of selected) {
    if (it.body && it.body !== b) selected.delete(sku);
  }
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.body === b);
  });
  renderCatalog();
  renderTabs();
  updateSummary();
}

function buildInvoice() {
  const items = [...selected.values()];
  const data = DATA[currentModel];
  const total = items.reduce((s, i) => s + (i.price || 0), 0);
  const vat = total * 0.07 / 1.07;
  const noVat = total - vat;

  const byCategory = new Map();
  data.categories.forEach(c => byCategory.set(c.name, []));
  items.forEach(it => {
    if (!byCategory.has(it._category)) byCategory.set(it._category, []);
    byCategory.get(it._category).push(it);
  });

  const now = new Date();
  const docNum = `КП-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${Math.floor(Math.random()*900+100)}`;
  const dateStr = now.toLocaleDateString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric' });

  let rowsHtml = '';
  let n = 0;
  byCategory.forEach((catItems, catName) => {
    if (!catItems.length) return;
    rowsHtml += `<tr class="cat-row"><td colspan="4">${catName}</td></tr>`;
    catItems.forEach(it => {
      n++;
      const groupLabel = it._group ? `<br><small style="color:#999">${it._group}${it.sublabel ? ' · ' + it.sublabel : ''}</small>` : '';
      const bodyLabel = it.body ? ` <span style="background:#C9A66B;color:#000;font-size:9px;padding:1px 5px;letter-spacing:1px;font-weight:700;">${it.body}</span>` : '';
      rowsHtml += `
        <tr>
          <td class="num">${n}</td>
          <td>
            <div style="font-weight:600">${it.name}${bodyLabel}</div>
            <div class="sku">${it.sku}</div>
            ${groupLabel}
          </td>
          <td style="font-size:11px;color:#777;font-style:italic;">${it.sub || ''}</td>
          <td class="price">${fmt(it.price)}</td>
        </tr>`;
    });
  });

  if (!items.length) {
    rowsHtml = `<tr><td colspan="4" style="padding:60px;text-align:center;color:#999;font-style:italic;">Выберите хотя бы одну позицию для формирования счёта</td></tr>`;
  }

  const html = `
    <div class="invoice-header">
      <div>
        <div class="invoice-brand">W&nbsp;&nbsp;E&nbsp;&nbsp;Y</div>
        <div class="invoice-brand-sub">Оригинальные аксессуары · 2026</div>
      </div>
      <div class="invoice-dealer">
        <strong>ООО «ГРИНВИЧ»</strong><br>
        Дилерский центр WEY<br>
        г. Иркутск, ул. Ширямова, 32<br>
        тел. 8 (3952) 500-700
      </div>
    </div>
    <div class="invoice-meta">
      <div class="invoice-meta-block">
        <strong>Документ</strong>
        <div class="v">Коммерческое предложение № ${docNum}</div>
      </div>
      <div class="invoice-meta-block" style="text-align:right;">
        <strong>Дата</strong>
        <div class="v">${dateStr}</div>
      </div>
      <div class="invoice-meta-block">
        <strong>Автомобиль</strong>
        <div class="v">${data.name}${data.hasBodyVariants ? ' · ' + currentBody + ' (исполнение кузова)' : ''}</div>
      </div>
      <div class="invoice-meta-block" style="text-align:right;">
        <strong>Позиций в предложении</strong>
        <div class="v">${items.length}</div>
      </div>
    </div>
    <div class="invoice-title">Спецификация аксессуаров и услуг</div>
    <div class="invoice-subtitle">Цены указаны с установкой в дилерском центре</div>
    <table class="invoice-table">
      <thead><tr><th>№</th><th>Наименование</th><th>Описание</th><th class="right">Стоимость</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    ${items.length ? `
    <div class="invoice-totals">
      <div class="invoice-totals-row"><span>Стоимость без НДС</span><span class="price">${fmt(Math.round(noVat))}</span></div>
      <div class="invoice-totals-row"><span>НДС 7%</span><span class="price">${fmt(Math.round(vat))}</span></div>
      <div class="invoice-totals-row grand"><span>ИТОГО</span><span class="price">${fmt(total)}</span></div>
    </div>` : ''}
    <div class="invoice-footer">
      <p>· Все аксессуары и услуги реализуются с НДС 7%.</p>
      <p>· Цены указаны в российских рублях с учётом установки (где применимо).</p>
      <p>· Данный документ носит информационный характер и не является публичной офертой.</p>
      <p>· Срок действия предложения — 14 календарных дней с даты составления.</p>
      <p>· Актуальность цен и наличие уточняйте у вашего менеджера по телефону 8 (3952) 500-700.</p>
    </div>`;
  document.getElementById('invoiceContent').innerHTML = html;
}

document.querySelectorAll('.model-btn').forEach(b => {
  b.addEventListener('click', () => setModel(b.dataset.model));
});
document.querySelectorAll('.toggle-btn').forEach(b => {
  b.addEventListener('click', () => setBody(b.dataset.body));
});
document.getElementById('btnClear').addEventListener('click', () => {
  if (selected.size === 0) return;
  if (confirm('Сбросить все выбранные позиции?')) {
    selected.clear();
    renderCatalog();
    renderTabs();
    updateSummary();
  }
});
document.getElementById('btnInvoice').addEventListener('click', () => {
  buildInvoice();
  document.getElementById('modal').classList.add('show');
  document.body.style.overflow = 'hidden';
});
document.getElementById('btnClose').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('show');
  document.body.style.overflow = '';
});
document.getElementById('btnPrint').addEventListener('click', () => window.print());
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') {
    document.getElementById('modal').classList.remove('show');
    document.body.style.overflow = '';
  }
});

updateHero();
renderTabs();
renderCatalog();
updateSummary();

</script>
</body>
</html>
